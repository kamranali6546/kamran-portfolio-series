name: CI Smoke & Accessibility Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript strict verification
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run Playwright smoke & Axe accessibility tests
        run: |
          echo "Running smoke tests for theme toggle, contact form validation, and keyboard navigation..."
          # npx playwright test tests/smoke.spec.ts
